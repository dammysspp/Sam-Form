<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assessment Analytics & Responses — SamForm</title>
  <meta name="description" content="Detailed response breakdown, analytics charts, and scores for your SamForm assessments by Samsco Communications." />

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/results.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <!-- Main root container for results application -->
  <div id="results-app">
    <div class="empty-state-card" style="margin: 4rem auto; max-width: 500px; text-align: center;">
      <h2>Loading Responses...</h2>
      <p class="text-muted">Aggregating submission records and calculating metrics...</p>
    </div>
  </div>

  <!-- Supabase JS Client CDN -->
  <!-- Supabase & EmailJS JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <!-- FormForge Scripts -->
  <script src="js/icons.js?v=2.1"></script>
  <script src="js/auth.js?v=2.1"></script>
  <script src="js/supabase.js?v=2.1"></script>
  <script src="js/storage.js?v=2.1"></script>
  <script src="js/utils.js?v=2.1"></script>
  <script src="js/questions.js?v=2.1"></script>
  <script src="js/exporter.js?v=2.1"></script>
  <script src="js/scoring.js?v=2.1"></script>
  <script src="js/bot_dispatcher.js?v=2.1"></script>
  <script src="js/devmode.js?v=2.1"></script>
  <script src="js/results.js?v=2.1"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Enforce Admin Authentication
      if (!FormForgeAuth.guard()) return;

      if (window.FormForgeSupabase) FormForgeSupabase.init();
      Results.init();
    });
  </script>
</body>
</html>
