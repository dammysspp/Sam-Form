<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assessment Builder — SamForm</title>
  <meta name="description" content="Build dynamic forms, timed exams, and quizzes with SamForm by Samsco Communications." />

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/builder.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="builder-header">
    <div class="builder-topbar">
      <div class="builder-title-group">
        <a href="index.html" class="btn-icon" title="Return to Dashboard">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </a>
        <input type="text" id="builder-form-title" class="builder-form-title-input" 
          value="Untitled Assessment" oninput="Builder.updateFormTitle(this.value)" />
        <span id="builder-status-badge" class="status-badge status-draft">DRAFT</span>
      </div>

      <div class="builder-stats-pill">
        <span id="stats-q-count">0 Questions</span>
        <span>•</span>
        <span id="stats-points-total">0 Points</span>
        <span>•</span>
        <span id="stats-time-total">Untimed</span>
      </div>

      <div class="builder-actions-group">
        <button type="button" class="btn-icon" id="btn-undo" title="Undo (Ctrl+Z)" onclick="Builder.undo()" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7v6h6"></path><path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"></path></svg>
        </button>
        <button type="button" class="btn-icon" id="btn-redo" title="Redo (Ctrl+Y)" onclick="Builder.redo()" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 7v6h-6"></path><path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"></path></svg>
        </button>
        
        <button type="button" class="btn btn-sm btn-outline" onclick="Builder.previewForm()" title="Preview (Ctrl+P)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg> Preview
        </button>
        <button type="button" class="btn btn-sm btn-secondary" onclick="Builder.openShareModal()">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg> Share
        </button>
        <button type="button" class="btn btn-sm btn-secondary" onclick="Builder.saveForm(true)" title="Save (Ctrl+S)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg> Save
        </button>
        <button type="button" class="btn btn-sm btn-primary" onclick="Builder.publishForm()" title="Publish (Ctrl+Enter)">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:-2px;"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg> Publish
        </button>
      </div>
    </div>

    <!-- Tabs Bar -->
    <div class="builder-tabs-bar">
      <button class="builder-nav-tab active" data-tab="questions" onclick="Builder.setTab('questions')">Questions</button>
      <button class="builder-nav-tab" data-tab="settings" onclick="Builder.setTab('settings')">Settings & Timer</button>
      <button class="builder-nav-tab" data-tab="logic" onclick="Builder.setTab('logic')">Branching Logic</button>
      <button class="builder-nav-tab" data-tab="theme" onclick="Builder.setTab('theme')">Theme & Design</button>
    </div>
  </header>

  <!-- Workspace Container -->
  <main class="builder-workspace" id="builder-main-content">
    <!-- Rendered via js/builder.js -->
  </main>

  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Real QR Code Generator Library -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <!-- FormForge Scripts -->
  <script src="js/icons.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/importer.js"></script>
  <script src="js/exporter.js"></script>
  <script src="js/scoring.js"></script>
  <script src="js/timer.js"></script>
  <script src="js/devmode.js"></script>
  <script src="js/builder.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Enforce Admin Authentication
      if (!FormForgeAuth.guard()) return;

      if (window.FormForgeSupabase) FormForgeSupabase.init();
      Builder.init();
    });
  </script>
</body>
</html>
